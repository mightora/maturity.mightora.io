name: Production smoke checks
on:
  workflow_run:
    workflows: [GitHub Pages deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
jobs:
  verify-live-site:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify published assets and desktop/mobile interaction
        run: node scripts/verify-production.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-screenshots
          path: qa/production/
